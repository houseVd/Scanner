<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eskanè QR Code</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #334155;
        }
        .result-box {
            margin-top: 15px;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            word-break: break-all;
        }
        .result-box h3 {
            font-size: 13px;
            color: #94a3b8;
            margin: 0 0 5px 0;
        }
        #qr-result {
            font-size: 15px;
            color: #4ade80;
            margin: 0;
        }
        .btn {
            margin-top: 15px;
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Eskanè QR Code</h2>
        
        <div id="reader"></div>

        <div class="result-box">
            <h3>Dènye rezilta eskane:</h3>
            <p id="qr-result">Vize yon QR Code...</p>
        </div>

        <button class="btn" onclick="startScanner()">Re-eskane</button>
    </div>

    <script>
        let html5QrCode;

        function onScanSuccess(decodedText, decodedResult) {
            // Afiche l sou ekran paj web la tou
            document.getElementById('qr-result').innerText = decodedText;
            
            // Voye tèks la bay aplikasyon Sketchware la nan EditText (ip_input) la
            if (window.AndroidBridge && typeof window.AndroidBridge.sendDataToApp === "function") {
                window.AndroidBridge.sendDataToApp(decodedText);
            }

            // Opsyonèl: Sispann eskanè a apre li fin li yon fwa siksè
            // html5QrCode.stop();
        }

        function onScanFailure(error) {
            // Erè nòmal pandan l ap chèche kòd la
        }

        function startScanner() {
            document.getElementById('qr-result').innerText = "Ap chèche QR Code...";
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, 
                {
                    fps: 10,
                    qrbox: { width: 220, height: 220 }
                },
                onScanSuccess,
                onScanFailure
            ).catch((err) => {
                document.getElementById('qr-result').innerText = "Erè louvri kamera.";
                console.error(err);
            });
        }

        window.onload = function() {
            startScanner();
        };
    </script>

</body>
</html>
