<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eskanè QR Code</title>
    <!-- Enpòte bibliyotèk html5-qrcode la -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 {
            margin-bottom: 15px;
            color: #38bdf8;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #334155;
        }
        .result-box {
            margin-top: 20px;
            padding: 12px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            word-break: break-all;
        }
        .result-box h3 {
            font-size: 14px;
            color: #94a3b8;
            margin: 0 0 5px 0;
        }
        #qr-result {
            font-size: 16px;
            color: #4ade80;
            margin: 0;
        }
        .btn {
            margin-top: 15px;
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Eskanè QR Code</h2>
        
        <!-- Kote kamera a ap afiche a -->
        <div id="reader"></div>

        <!-- Zòn pou afiche rezilta a -->
        <div class="result-box">
            <h3>Rezilta Eskanè a:</h3>
            <p id="qr-result">Tann kamera a louvri...</p>
        </div>

        <button class="btn" id="start-btn" onclick="startScanner()">Re-eskane</button>
    </div>

    <script>
        let html5QrCode;

        function onScanSuccess(decodedText, decodedResult) {
            // Lè li fin jwenn yon QR Code
            document.getElementById('qr-result').innerText = decodedText;
            
            // Si w vle ouvè lyen an otomatikman si se yon sit entènèt:
            if (decodedText.startsWith("http://") || decodedText.startsWith("https://")) {
                if(confirm("Èske w vle louvri lyen sa a? \n" + decodedText)) {
                    window.location.href = decodedText;
                }
            }

            // Si w vle sispann eskanè a apre li fin li yon fwa:
            // stopScanner();
        }

        function onScanFailure(error) {
            // Erè pandan l ap chèche kòd la (nòmal lè li poko wè anyen, kidonk nou pa bezwen afiche l tout tan)
        }

        function startScanner() {
            document.getElementById('qr-result').innerText = "Ap chèche QR Code...";
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, // Sèvi ak kamera dèyè telefòn nan
                {
                    fps: 10,    // Kantite ankadreman pa segond
                    qrbox: { width: 250, height: 250 } // Gwosè bwat eskanè a
                },
                onScanSuccess,
                onScanFailure
            ).catch((err) => {
                document.getElementById('qr-result').innerText = "Erè: Pa ka louvri kamera a (fòk ou bay pèmisyon).";
                console.error(err);
            });
        }

        // Lè paj la chaje, nou lance eskanè a otomatikman
        window.onload = function() {
            startScanner();
        };
    </script>

</body>
</html>
